services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build: ./php
    volumes:
      - ./src:/var/www/html
      - php_logs:/var/www/html/storage/logs  # Volume para logs da aplicação
    environment:
      - DB_HOST=mysql
      - DB_NAME=monitoramento_db
      - DB_USER=monitoramento_user
      - DB_PASS=monitoramento_password
      - OTEL_SERVICE_NAME=php-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_PHP_AUTOLOAD_ENABLED=true
    depends_on:
      - mysql
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: monitoramento_db
      MYSQL_USER: monitoramento_user
      MYSQL_PASSWORD: monitoramento_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    container_name: otel-collector
    user: "0"
    volumes:
      - ./opentelemetry-collector/config.yaml:/etc/otel/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # Logs do Docker
      - nginx_logs:/var/log/nginx:ro  # Logs do Nginx
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/etc/hostname-host:ro
      - php_logs:/var/www/html/storage/logs:ro  # Logs da aplicação PHP
    command: 
      - "--config=/etc/otel/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8888:8888"
    environment:
      - DOCKER_API_VERSION=1.40
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_HOSTNAME=fedora
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    hostname: fedora

volumes:
  mysql_data:
  nginx_logs:  # Volume para logs do Nginx
  php_logs:    # Volume para logs da aplicação PHP

networks:
  app-network:
    driver: bridge
    attachable: true