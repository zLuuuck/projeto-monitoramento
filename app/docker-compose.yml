services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  php:
    build: ./php
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_NAME=monitoramento_db
      - DB_USER=monitoramento_user
      - DB_PASS=monitoramento_password
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: monitoramento_db
      MYSQL_USER: monitoramento_user
      MYSQL_PASSWORD: monitoramento_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    user: "0"
    volumes:
      - ./opentelemetry-collector/config.yaml:/etc/otel/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/etc/hostname-host:ro  # Lê o hostname real do host
    command: 
      - "--config=/etc/otel/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8888:8888"
    environment:
      - DOCKER_API_VERSION=1.40
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_HOSTNAME=fedora  # Define explicitamente o hostname
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    hostname: fedora  # Define o hostname do container como "fedora"

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
    attachable: true