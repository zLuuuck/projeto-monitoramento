# Este arquivo é apenas para referência, não precisa ser carregado
# Configurações específicas para métricas do host Linux
hostmetrics:
  collection_interval: 30s
  scrapers:
    cpu:
      metrics:
        system.cpu.time: 
          enabled: true
        system.cpu.utilization:
          enabled: true
    memory:
      metrics:
        system.memory.usage:
          enabled: true
        system.memory.utilization:
          enabled: true
    disk:
      metrics:
        system.disk.io:
          enabled: true
        system.disk.operations:
          enabled: true
    filesystem:
      metrics:
        system.filesystem.usage:
          enabled: true
        system.filesystem.utilization:
          enabled: true
    network:
      metrics:
        system.network.io:
          enabled: true
        system.network.connections:
          enabled: true
    load:
      metrics:
        system.cpu.load_average.1m:
          enabled: true
        system.cpu.load_average.5m:
          enabled: true
        system.cpu.load_average.15m:
          enabled: true