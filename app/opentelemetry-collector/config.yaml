receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 5s

  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      disk: {}

  # Logs do Docker
  filelog/docker:
    include: [/var/lib/docker/containers/*/*-json.log]
    poll_interval: 500ms
    start_at: end
    operators:
      - type: json_parser
        parse_from: body
      - type: add
        field: attributes.service.name
        value: "docker"

  # Logs do Nginx (agora com formato simples)
  filelog/nginx:
    include: [/var/log/nginx/*.log]
    poll_interval: 500ms
    start_at: end
    operators:
      - type: add
        field: attributes.service.name
        value: "nginx"

  # Logs do PHP
  filelog/php:
    include: [/var/www/html/storage/logs/*.log]
    poll_interval: 500ms
    start_at: end
    operators:
      - type: json_parser
        parse_from: body
      - type: add
        field: attributes.service.name
        value: "php-app"

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]
    timeout: 5s

exporters:
  otlp:
    endpoint: "ingest.us.signoz.cloud:443"
    tls:
      insecure: false
    headers:
      "signoz-access-token": "a2442dc2-80db-4b78-83ed-41fa2e8e76de"
    compression: gzip
    timeout: 30s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp]
    
    metrics:
      receivers: [otlp, docker_stats, hostmetrics]
      processors: [resourcedetection, batch]
      exporters: [otlp]
    
    logs:
      receivers: [otlp, filelog/docker, filelog/nginx, filelog/php]
      processors: [resourcedetection, batch]
      exporters: [otlp]