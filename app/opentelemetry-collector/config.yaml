receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 5s
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      # Removemos filesystem, paging, processes e process que causam erros

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  resourcedetection:
    detectors: [system, env, docker]
    system:
      hostname_sources: [os]
    timeout: 5s

exporters:
  otlp:
    endpoint: "ingest.us.signoz.cloud:443"
    tls:
      insecure: false
    headers:
      "signoz-access-token": "a2442dc2-80db-4b78-83ed-41fa2e8e76de"
    compression: gzip
    timeout: 30s
  logging:
    verbosity: normal  # Reduzido para ver menos logs

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp, docker_stats, hostmetrics]
      processors: [resourcedetection, batch]
      exporters: [otlp]  # Removemos logging para reduzir output
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp]

  telemetry:
    logs:
      level: info
    metrics:
      level: basic