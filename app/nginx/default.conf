server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Configurações de segurança
    client_max_body_size 100M;

    # Páginas estáticas
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # CSS, JS, imagens - SERVE arquivos estáticos corretamente
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        root /var/www/html;
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploads - CORRIGIDO
    location /uploads/ {
        alias /var/www/html/uploads/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # PHP - CONFIGURAÇÃO CORRIGIDA
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Headers adicionais
        fastcgi_param DB_HOST mysql;
        fastcgi_param DB_NAME monitoramento_db;
        fastcgi_param DB_USER monitoramento_user;
        fastcgi_param DB_PASS monitoramento_password;
    }

    # Bloqueia acesso a arquivos sensíveis
    location ~ /\.ht {
        deny all;
    }

    # Permite acesso a scripts e components (necessário)
    location ~ /(scripts|components)/ {
        try_files $uri =404;
    }
}