# Configuração simplificada para o Nginx Alpine
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de log JSON
    log_format json_combined escape=json
    '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"server_name":"$server_name",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Configurações do servidor
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php index.html index.htm;

        # Configurações de segurança
        client_max_body_size 100M;

        # Páginas estáticas
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # CSS, JS, imagens
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Uploads
        location /uploads/ {
            alias /var/www/html/uploads/;
            autoindex off;
            expires 1y;
            add_header Cache-Control "public";
        }

        # PHP
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            # Headers adicionais
            fastcgi_param DB_HOST mysql;
            fastcgi_param DB_NAME monitoramento_db;
            fastcgi_param DB_USER monitoramento_user;
            fastcgi_param DB_PASS monitoramento_password;
        }

        # Bloqueia acesso a arquivos sensíveis
        location ~ /\.ht {
            deny all;
        }

        # Permite acesso a scripts e components
        location ~ /(scripts|components)/ {
            try_files $uri =404;
        }
    }
}